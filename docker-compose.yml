# Inside Life — local stack.
#   docker compose up -d postgres redis        # infrastructure only (run backend/frontend with npm for hot reload)
#   docker compose up --build                  # everything, served at http://localhost:8080
name: insidelife

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: insidelife
      POSTGRES_PASSWORD: insidelife
      POSTGRES_DB: insidelife
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insidelife -d insidelife"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; AOF keeps queues across restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (SeaweedFS, Apache-2.0) for billboard creatives and club tracks.
  # The API writes with credentials; the browser reads public media anonymously through the gateway at /media.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256", "-volume.max=0"]
    ports:
      - "58333:8333"
    volumes:
      - storagedata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/status >/dev/null 2>&1 || wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGINS: http://localhost:8080
      LOG_LEVEL: info
      DATABASE_URL: postgres://insidelife:insidelife@postgres:5432/insidelife
      DATABASE_RUN_MIGRATIONS: "true"
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-docker-secret-please-change-0123456789abcdef}
      COOKIE_SECURE: "false"
      # Email codes: optional by default. Turning the requirement on needs an SMTP_URL (see docs/DEPLOY.md -> Email).
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Inside Life <hello@insidelife.online>}
      GAME_EPOCH: ${GAME_EPOCH:-2026-10-01T00:00:00.000Z}
      GAME_TIME_SCALE: ${GAME_TIME_SCALE:-120}
      WORLD_SEED: ${WORLD_SEED:-eko-o-ni-baje}
      MARKET_SEED: ${MARKET_SEED:-docker-local-market-seed-0123456789}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_CALLBACK_URL: http://localhost:8080/payments/callback
      TOPUP_DAILY_LIMIT_NGN: 20000
      # Production mode demands a Paystack key; locally we allow the sandbox checkout instead.
      ALLOW_PAYMENT_SANDBOX: "true"
      S3_ENDPOINT: http://storage:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY: insidelife
      S3_SECRET_KEY: insidelife-storage-secret
      S3_BUCKET: insidelife-media
      S3_PRIVATE_BUCKET: insidelife-private
      S3_PUBLIC_BASE_URL: /media
      ADMIN_EMAILS: ${ADMIN_EMAILS:-oluwasemilogo@insidelife.online}
      # The admin portal (separate repo) in dev: `npm run dev` there serves http://localhost:5174.
      ADMIN_ORIGINS: ${ADMIN_ORIGINS:-http://localhost:5174}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
  storagedata:
