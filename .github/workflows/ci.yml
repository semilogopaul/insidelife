# Every push and pull request: lint, typecheck, unit tests and production builds for all three workspaces.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (builds packages/shared)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # The real backend booted in-process against Postgres and Redis: money flows, payments (sandbox and a fake
  # Flutterwave API), ads, transfers, admin, migrations and the production config. See docs/PRODUCTION_READINESS.md.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: insidelife
          POSTGRES_PASSWORD: insidelife
          POSTGRES_DB: insidelife
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insidelife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (builds packages/shared)
        run: npm ci
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://insidelife:insidelife@localhost:5432/insidelife_e2e
          E2E_REDIS_URL: redis://localhost:6379/11
