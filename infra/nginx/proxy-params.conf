# Headers and protocol settings for every proxied location of the Azure gateway (default.conf.template).
# nginx drops inherited proxy_set_header lines in a location that sets its own, so locations that need an extra header
# (/socket.io) include this file again.
proxy_http_version 1.1;
proxy_ssl_server_name on;
# Keep-alive to the upstream, except for WebSocket upgrades (the empty value is not sent).
proxy_set_header Connection $upstream_connection;
proxy_set_header Upgrade $http_upgrade;
# Container Apps ingress routes by Host header: send the upstream's own host; the visitor's host travels separately.
proxy_set_header Host $proxy_host;
proxy_set_header X-Forwarded-Host $host;
# The real visitor, from CF-Connecting-IP (see $client_ip in the template). The API reads CLIENT_IP_HEADER=cf-connecting-ip.
proxy_set_header X-Forwarded-For $client_ip;
proxy_set_header CF-Connecting-IP $client_ip;
proxy_set_header X-Real-IP $client_ip;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Request-Id $request_id;
