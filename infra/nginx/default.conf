# Single origin for the browser: the game UI, the REST API and the realtime socket all live on :8080,
# so the refresh-token cookie stays first-party and no CORS preflights are needed.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Behind the HTTPS edge (Caddy) keep the scheme it saw; locally (no edge) it's this hop's.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

upstream backend  { server backend:4000;  keepalive 32; }
upstream frontend { server frontend:3000; keepalive 32; }
upstream storage  { server storage:8333;  keepalive 16; }

server {
  listen 80;
  server_name _;

  client_max_body_size 64k;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  # Billboard creatives (≤4 MB) and club tracks (≤10 MB) are uploaded through the API.
  location ~ ^/api/v1/promotions/(creatives|tracks)$ {
    client_max_body_size 11m;
    proxy_request_buffering on;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-Id $request_id;
  }

  # Chat voice notes (≤600 KB) and photos (≤3 MB) are uploaded through the API.
  location ~ ^/api/v1/chat/dms/[^/]+/media$ {
    client_max_body_size 4m;
    proxy_request_buffering on;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-Id $request_id;
  }

  location /socket.io/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # Public liveness probe; Prometheus metrics stay internal (scrape backend:4000/api/metrics on the private network).
  location = /health { proxy_pass http://backend/api/health; }
  location = /api/metrics { return 404; }

  # Public media (approved billboard creatives, club tracks). Read-only: only GET/HEAD reach storage.
  location /media/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://storage/insidelife-media/;
    proxy_set_header Host storage:8333;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=86400";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Long-lived caching for hashed Next.js assets and game models/audio.
  location /_next/static/ {
    proxy_pass http://frontend;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
