# Security headers shared by the compose gateway (default.conf) and the Azure gateway image (default.conf.template).
# Included at server level and again in every location that sets its own add_header (nginx does not merge them).
#
# The web app (frontend/next.config.ts) and the API (helmet) set some of these too, so they are hidden from the
# upstream response first and set once here: no duplicate headers reach the browser. Running either app without this
# gateway (npm run dev:*) still gets its own.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The game uses the microphone (voice); nothing else.
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Report-Only on purpose: the policy below is written for Next.js inline bootstrap scripts, React Three Fiber (WebGL,
# blob: textures and workers), audio, self-hosted fonts and the Flutterwave full-page checkout redirect, but it has not
# been verified in a browser. Watch the console for violations, then rename the header to Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
